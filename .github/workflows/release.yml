name: Release

# Tag-triggered (or manually retried): build a real deno on each v82jsc backend
# and attach the binaries to the GitHub release for that tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v8x tag to build and publish artifacts for
        required: true
        type: string

permissions:
  contents: write

jobs:
  deno:
    name: deno-${{ matrix.backend }}
    runs-on: macos-15
    timeout-minutes: 180
    continue-on-error: ${{ matrix.experimental || false }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: jsc
            v8x_features: '"engine_jsc", "vendor_jsc"'
            cli_features: hmr
            ninja: true
            experimental: true
          - backend: sys-jsc
            v8x_features: '"system_jsc"'
            cli_features: hmr
            experimental: true
          - backend: quickjs
            cli_features: quickjs
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          submodules: false
      # The repository defaults submodules to `update = none` so Cargo can
      # initialize only the backend it builds. Override that policy explicitly:
      # actions/checkout's recursive mode otherwise registers empty submodule
      # worktrees, which build.rs mistakes for initialized sources.
      - name: Init submodules
        run: |
          if [ "${{ matrix.ninja }}" = "true" ]; then
            git \
              -c submodule.vendor/webkit.update=checkout \
              -c submodule.vendor/quickjs-ng.update=checkout \
              -c submodule.vendor/rusty_v8.update=checkout \
              -c submodule.vendor/wamr.update=checkout \
              submodule update --init --depth 1 --recursive
          else
            git \
              -c submodule.vendor/quickjs-ng.update=checkout \
              -c submodule.vendor/rusty_v8.update=checkout \
              -c submodule.vendor/wamr.update=checkout \
              submodule update --init --depth 1 --recursive \
              vendor/rusty_v8 vendor/quickjs-ng vendor/wamr
          fi
      - uses: dtolnay/rust-toolchain@stable
      - name: Install ninja (WebKit build)
        if: matrix.ninja
        run: brew install ninja

      # Reuse the same vendored-WebKit cache the CI workflow populates (jsc only).
      - name: WebKit cache key
        if: matrix.ninja
        id: wk
        run: echo "sha=$(git rev-parse HEAD:vendor/webkit)" >> "$GITHUB_OUTPUT"
      - name: Cache vendored WebKit build
        if: matrix.ninja
        uses: actions/cache@v4
        with:
          path: vendor/webkit/WebKitBuild
          key: webkit-${{ runner.os }}-${{ steps.wk.outputs.sha }}-${{ hashFiles('patches/webkit-*.patch', 'tools/setup_webkit.sh') }}

      - name: Clone dodo + point its v8 dependency at this checkout
        run: |
          set -euo pipefail
          DENO_REF="$(cat tools/deno/DENO_REF)"
          mkdir -p ../deno && git -C ../deno init -q
          git -C ../deno remote add origin https://github.com/are-we-dodo-yet/dodo
          git -C ../deno fetch --depth 1 origin "$DENO_REF"
          git -C ../deno checkout -q FETCH_HEAD
          perl -pi -e 's#^v8 = \{ package = "dodo-v8x", version = "[^"]+"#v8 = { package = "dodo-v8x", path = "$ENV{GITHUB_WORKSPACE}"#' ../deno/Cargo.toml
          if [ -n '${{ matrix.v8x_features }}' ]; then
            perl -pi -e 's#^(v8 = \{ package = "dodo-v8x", .*features = \["simdutf")\]#$1, ${{ matrix.v8x_features }}]#' ../deno/Cargo.toml
          fi
          grep -F "path = \"$GITHUB_WORKSPACE\"" ../deno/Cargo.toml
      # dodo's aarch64-apple-darwin rustflags link with -fuse-ld=lld; the
      # runner image has none, so fetch the same prebuilt ld64.lld dodo CI uses.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install dodo's macOS lld
        working-directory: ../deno
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 -- tests/util/std
          ./tools/install_prebuilt.js ld64.lld
          echo "$PWD/third_party/prebuilt/mac" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "../deno"
          key: deno-${{ matrix.backend }}

      - name: Build deno (${{ matrix.backend }})
        working-directory: ../deno
        run: |
          set -euo pipefail
          cargo build --release --bin deno --no-default-features --features "${{ matrix.cli_features }}"
          codesign --force --sign - --entitlements cli/entitlements.plist target/release/deno

      - name: Package the binary
        run: |
          set -euo pipefail
          asset="deno-${{ matrix.backend }}-aarch64-apple-darwin"
          mkdir -p dist
          cp ../deno/target/release/deno "dist/$asset"
          gzip -9 -c "dist/$asset" > "dist/$asset.gz"

      - name: Upload to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: dist/deno-${{ matrix.backend }}-aarch64-apple-darwin.gz
